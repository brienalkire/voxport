[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voxport"
version = "0.3.0"
description = "Shared personal voice toolkit: TTS/STT ports and adapters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
# KokoroDirectTTS: in-process Kokoro model (pulls in torch, ~2 GB).
kokoro = [
    "kokoro>=0.9.4",
    "torch>=2.12.0",
]
# WyomingWhisperSTT: lightweight network client, no local model.
wyoming = [
    "wyoming>=1.5.0",
]
all = [
    "voxport[kokoro,wyoming]",
]

[tool.setuptools]
packages = ["voxport", "voxport.tts", "voxport.stt"]
