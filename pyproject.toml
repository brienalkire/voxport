[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voxport"
version = "0.3.0"
description = "Shared personal voice toolkit: TTS/STT ports and adapters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "kokoro>=0.9.4",
    "soundfile>=0.13.1",
    "torch>=2.12.0",
    "numpy>=2.0",
    "wyoming>=1.5.0",
]

[tool.setuptools]
packages = ["voxport", "voxport.tts", "voxport.stt"]
