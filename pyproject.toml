[build-system]
# 77+ for the PEP 639 `license = "MIT"` expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voxport"
version = "0.5.2"
description = "Text-to-speech and speech-to-text interfaces with swappable engine adapters (Kokoro, Wyoming Whisper)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brien Alkire" }]
requires-python = ">=3.10"
keywords = [
    "tts",
    "stt",
    "text-to-speech",
    "speech-to-text",
    "speech",
    "voice",
    "kokoro",
    "whisper",
    "wyoming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # 1.26 too: conda/miniforge base environments often still ship it.
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/brienalkire/voxport"
Repository = "https://github.com/brienalkire/voxport"
Changelog = "https://github.com/brienalkire/voxport/blob/main/CHANGELOG.md"
Issues = "https://github.com/brienalkire/voxport/issues"

[project.optional-dependencies]
# KokoroDirectTTS: in-process Kokoro model (pulls in torch, ~2 GB).
kokoro = [
    "kokoro>=0.9.4",
    "torch>=2.12.0",
    # Kokoro's English phonemizer (misaki) downloads spaCy's en_core_web_sm
    # on first use. spaCy installs it with this environment's pip if there
    # is one; otherwise it falls back to a bare `uv pip install`, which can
    # land in a different environment (uv-made environments have no pip),
    # so the model is never found.
    "pip",
]
# WyomingWhisperSTT: lightweight network client, no local model.
wyoming = [
    "wyoming>=1.5.0",
]
all = [
    "voxport[kokoro,wyoming]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["voxport", "voxport.tts", "voxport.stt"]
