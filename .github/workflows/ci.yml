name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The wyoming extra only; the kokoro extra pulls in torch (~2 GB),
      # and the Kokoro adapter isn't unit-tested.
      - run: python -m pip install -e ".[wyoming]" pytest
      - run: python -m pytest -rs

  test-no-extras:
    name: Test without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -rs

  test-numpy1:
    # numpy>=1.26 is allowed for conda/miniforge base environments; check it.
    name: Test with numpy 1.26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy==1.26.*" -e ".[wyoming]" pytest
      - run: python -c "import numpy; assert numpy.__version__.startswith('1.26'), numpy.__version__"
      - run: python -m pytest -rs

  package:
    name: Build and check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
